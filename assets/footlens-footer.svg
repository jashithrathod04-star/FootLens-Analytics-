text{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flow{to{stroke-dashoffset:-48}}
@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes bars{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
@keyframes scan{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}
.rise{opacity:0;animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards}
.float{animation:float 5s ease-in-out infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 16s linear infinite}
.flow{stroke-dasharray:5 7;animation:flow 2.2s linear infinite}
.gx{transform-box:fill-box;transform-origin:left center;animation:growx 1.4s cubic-bezier(.2,.7,.2,1) both}
.bar{transform-box:fill-box;transform-origin:center bottom;animation:bars 2.6s ease-in-out infinite}
.scan{stroke-dasharray:180 820;animation:scan 3.4s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.rise{opacity:1!important}}
