<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="56" viewBox="0 0 1200 56" role="img" aria-label="FootLens animated tagline ticker" xmlns:c2pa="http://c2pa.org/manifest"><title>FootLens animated tagline ticker</title><defs><linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e325c" stop-opacity=".78"/><stop offset="1" stop-color="#091224" stop-opacity=".92"/></linearGradient><linearGradient id="bgd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050912"/><stop offset=".55" stop-color="#0a1428"/><stop offset="1" stop-color="#06101e"/></linearGradient><linearGradient id="acc" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#9b7bff"/></linearGradient><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter><linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#000"/><stop offset=".1" stop-color="#fff"/><stop offset=".9" stop-color="#fff"/><stop offset="1" stop-color="#000"/></linearGradient><mask id="m"><rect width="1200" height="56" fill="url(#fade)"/></mask></defs><style>
text{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flow{to{stroke-dashoffset:-48}}
@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes bars{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
@keyframes scan{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}
.rise{opacity:0;animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards}
.float{animation:float 5s ease-in-out infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 16s linear infinite}
.flow{stroke-dasharray:5 7;animation:flow 2.2s linear infinite}
.gx{transform-box:fill-box;transform-origin:left center;animation:growx 1.4s cubic-bezier(.2,.7,.2,1) both}
.bar{transform-box:fill-box;transform-origin:center bottom;animation:bars 2.6s ease-in-out infinite}
.scan{stroke-dasharray:180 820;animation:scan 3.4s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.rise{opacity:1!important}}
