<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="290" viewBox="0 0 1200 290" role="img" aria-label="FootLens data-to-dashboard workflow" xmlns:c2pa="http://c2pa.org/manifest"><title>FootLens data-to-dashboard workflow</title><defs><linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e325c" stop-opacity=".78"/><stop offset="1" stop-color="#091224" stop-opacity=".92"/></linearGradient><linearGradient id="bgd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050912"/><stop offset=".55" stop-color="#0a1428"/><stop offset="1" stop-color="#06101e"/></linearGradient><linearGradient id="acc" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#9b7bff"/></linearGradient><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter></defs><style>
text{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flow{to{stroke-dashoffset:-48}}
@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes bars{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
@keyframes scan{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}
.rise{opacity:0;animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards}
.float{animation:float 5s ease-in-out infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 16s linear infinite}
.flow{stroke-dasharray:5 7;animation:flow 2.2s linear infinite}
.gx{transform-box:fill-box;transform-origin:left center;animation:growx 1.4s cubic-bezier(.2,.7,.2,1) both}
.bar{transform-box:fill-box;transform-origin:center bottom;animation:bars 2.6s ease-in-out infinite}
.scan{stroke-dasharray:180 820;animation:scan 3.4s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.rise{opacity:1!important}}
@keyframes lit{0%{stroke-opacity:.25;fill:#0d1a33}3%{stroke-opacity:1;fill:#12304a}10%{stroke-opacity:1;fill:#12304a}18%{stroke-opacity:.25;fill:#0d1a33}100%{stroke-opacity:.25;fill:#0d1a33}}.n{fill:#0d1a33;stroke-opacity:.25;animation:lit 10.8s linear infinite}</style><rect width="1200" height="290" rx="24" fill="url(#bgd)"/><rect x=".5" y=".5" width="1199" height="289" rx="24" fill="none" stroke="#96b4dc" stroke-opacity=".16"/><line class="flow" x1="184" y1="81" x2="219" y2="81" stroke="#22d3ee" stroke-opacity=".7" stroke-width="2"/><line class="flow" x1="379" y1="81" x2="414" y2="81" stroke="#22d3ee" stroke-opacity=".7" stroke-width="2"/><line class="flow" x1="574" y1="81" x2="609" y2="81" stroke="#22d3ee" stroke-opacity=".7" stroke-width="2"/><line class="flow" x1="769" y1="81" x2="804" y2="81" stroke="#22d3ee" stroke-opacity=".7" stroke-width="2"/><line class="flow" x1="964" y1="81" x2="999" y2="81" stroke="#22d3ee" stroke-opacity=".7" stroke-width="2"/><path class="flow" d="M1159 81 C1199 81 1199 215 1159 215" fill="none" stroke="#9b7bff" stroke-opacity=".7" stroke-width="2"/><line class="flow" x1="999" y1="215" x2="964" y2="215" stroke="#9b7bff" stroke-opacity=".7" stroke-width="2"/><line class="flow" x1="804" y1="215" x2="769" y2="215" stroke="#2ef2a0" stroke-opacity=".7" stroke-width="2"/><line class="flow" x1="609" y1="215" x2="574" y2="215" stroke="#2ef2a0" stroke-opacity=".7" stroke-width="2"/><line class="flow" x1="414" y1="215" x2="379" y2="215" stroke="#2ef2a0" stroke-opacity=".7" stroke-width="2"/><line class="flow" x1="219" y1="215" x2="184" y2="215" stroke="#ffb454" stroke-opacity=".7" stroke-width="2"/><g class="rise" style="animation-delay:0.00s"><rect class="n" x="24" y="46" width="160" height="70" rx="16" stroke="#22d3ee" stroke-width="2" style="animation-delay:0.00s"/><text class="m" x="40" y="72" font-size="11" letter-spacing="2" fill="#22d3ee">01</text><text x="40" y="96" font-size="14" font-weight="700" fill="#f4f9ff">Raw Dataset</text></g>