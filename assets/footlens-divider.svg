<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="44" viewBox="0 0 1200 44" role="img" aria-label="Animated divider" xmlns:c2pa="http://c2pa.org/manifest"><title>Animated divider</title><defs><linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e325c" stop-opacity=".78"/><stop offset="1" stop-color="#091224" stop-opacity=".92"/></linearGradient><linearGradient id="bgd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050912"/><stop offset=".55" stop-color="#0a1428"/><stop offset="1" stop-color="#06101e"/></linearGradient><linearGradient id="acc" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#9b7bff"/></linearGradient><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter><linearGradient id="ln" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset=".25" stop-color="#22d3ee"/><stop offset=".75" stop-color="#9b7bff"/><stop offset="1" stop-color="#9b7bff" stop-opacity="0"/></linearGradient></defs><style>
text{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flow{to{stroke-dashoffset:-48}}
@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes bars{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
@keyframes scan{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}
.rise{opacity:0;animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards}
.float{animation:float 5s ease-in-out infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 16s linear infinite}
.flow{stroke-dasharray:5 7;animation:flow 2.2s linear infinite}
.gx{transform-box:fill-box;transform-origin:left center;animation:growx 1.4s cubic-bezier(.2,.7,.2,1) both}
.bar{transform-box:fill-box;transform-origin:center bottom;animation:bars 2.6s ease-in-out infinite}
.scan{stroke-dasharray:180 820;animation:scan 3.4s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.rise{opacity:1!important}}
</style><rect x="0" y="21" width="1200" height="2" fill="url(#ln)" opacity=".55"/><circle r="4" cy="22" fill="#fff" filter="url(#glow)"><animate attributeName="cx" from="0" to="1200" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="5s" repeatCount="indefinite"/></circle><circle r="3" cy="22" fill="#2ef2a0" filter="url(#glow)"><animate attributeName="cx" from="1200" to="0" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="7s" repeatCount="indefinite"/></circle><path d="M520 22h40l6-8 6 16 8-22 8 28 6-14h40" transform="translate(40 0)" fill="none" stroke="#22d3ee" stroke-opacity=".18" stroke-width="2" pathLength="1000"/><path class="scan" transform="translate(40 0)" d="M520 22h40l6-8 6 16 8-22 8 28 6-14h40" fill="none" stroke="#2ef2a0" stroke-width="2" pathLength="1000" stroke-linecap="round" style="animation-duration:2.4s"/><g transform="translate(600 22)"><polygon points="0,-12 11,-6 11,6 0,12 -11,6 -11,-6" fill="#050912" stroke="url(#acc)" stroke-width="2"/><circle class="spin" r="6" fill="none" stroke="url(#acc)" stroke-width="1.4" stroke-dasharray="3 3"/></g><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>